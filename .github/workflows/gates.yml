# Гейты фабрики. Вызывается из продуктового репозитория по SHA:
#
#   uses: OWNER/factory-ci/.github/workflows/gates.yml@<40-символьный SHA>
#
# Обязательные проверки в защите ветки — джобы `verdict` и `source-guard`
# (D-106 §c). Обе запускаются всегда, без `if:`: пропущенная обязательная
# проверка засчиталась бы как успех. `verdict` вдобавок требует success от
# source-guard. Остальные джобы добавляются и убираются без правки настроек.
name: gates

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      run-e2e:
        type: boolean
        default: true
      run-unit:
        type: boolean
        default: true

# Пустой набор по умолчанию: каждая джоба добавляет себе ровно то, что нужно.
permissions: {}

jobs:
  # --- Предполёт. Отдельная джоба, потому что её провал — не провал работы ---
  preflight:
    needs: [deps-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Установка зависимостей без чужих скриптов
        shell: bash
        run: |
          # PR не может сам разрешить install scripts через свой package.json.
          # Необходимые генераторы вызываются явно после deps-guard.
          npm ci --ignore-scripts
          echo "Install scripts отключены. Allowlist из head-версии продукта не исполняется."
      # Подготовка базы. Дублируется в трёх джобах намеренно: reusable workflow
      # исполняется в контексте вызывающего репозитория, поэтому composite
      # action из factory-ci здесь недоступен, а `uses:` не принимает выражений.
      - name: Подготовка базы
        shell: bash
        run: |
          [ -f prisma/schema.prisma ] || { echo "Prisma не используется."; exit 0; }
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          export DATABASE_URL="${DATABASE_URL:-file:./dev.db}"
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - id: run
        shell: bash
        run: |
          # Не исполняем product-defined scripts/preflight.sh: автор PR не
          # должен определять результат предполёта. Проверяем только
          # установленное дерево и инструменты из зафиксированного lockfile.
          npm ls --depth=0
          if [ -f prisma/schema.prisma ]; then
            npx --no-install prisma validate
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"

  # --- Дифф зависимостей проверяется РАНЬШЕ установки (F-24) ----------------
  # Смысл в порядке: postinstall выполняется в момент установки, поэтому
  # проверять изменения зависимостей после неё бессмысленно — чужой код уже
  # отработал. Джобы, которые ставят пакеты, ждут эту.
  deps-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Изменения package.json и lockfile
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — сравнивать нечего."; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          pkg=$(printf '%s\n' "$changed" | grep -c '^package\.json$' || true)
          lock=$(printf '%s\n' "$changed" | grep -c '^package-lock\.json$' || true)

          if [ "$pkg" = 0 ] && [ "$lock" = 0 ]; then
            echo "Зависимости не менялись."; exit 0
          fi

          echo "::error title=Зависимости изменены::Обычный продуктовый PR не может менять package.json или lockfile. Требуется отдельное изменение владельца с review supply chain и новым пином factory-ci."
          exit 1

  checks:
    needs: [preflight, deps-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, typecheck, unit, build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Установка зависимостей без чужих скриптов
        shell: bash
        run: |
          # PR не может сам разрешить install scripts через свой package.json.
          # Необходимые генераторы вызываются явно после deps-guard.
          npm ci --ignore-scripts
          echo "Install scripts отключены. Allowlist из head-версии продукта не исполняется."
      # Подготовка базы. Дублируется в трёх джобах намеренно: reusable workflow
      # исполняется в контексте вызывающего репозитория, поэтому composite
      # action из factory-ci здесь недоступен, а `uses:` не принимает выражений.
      - name: Подготовка базы
        shell: bash
        run: |
          [ -f prisma/schema.prisma ] || { echo "Prisma не используется."; exit 0; }
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          export DATABASE_URL="${DATABASE_URL:-file:./dev.db}"
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - name: ${{ matrix.gate }}
        shell: bash
        run: |
          case "${{ matrix.gate }}" in
            lint)
              npx --no-install eslint . ;;
            typecheck)
              [ ! -x node_modules/.bin/next ] || npx --no-install next typegen
              npx --no-install tsc --noEmit ;;
            unit)
              if [ "${{ inputs.run-unit }}" != "true" ]; then
                echo "unit-тесты явно отключены защищённым caller workflow"
              elif ! find tests/unit -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit 2>/dev/null | grep -q .; then
                echo "::error::run-unit=true, но unit-тестов нет"
                exit 1
              else
                npx --no-install vitest run
              fi ;;
            build)
              npx --no-install next build ;;
          esac

  e2e:
    needs: [preflight, deps-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Установка зависимостей без чужих скриптов
        shell: bash
        run: |
          # PR не может сам разрешить install scripts через свой package.json.
          # Необходимые генераторы вызываются явно после deps-guard.
          npm ci --ignore-scripts
          echo "Install scripts отключены. Allowlist из head-версии продукта не исполняется."
      # Подготовка базы. Дублируется в трёх джобах намеренно: reusable workflow
      # исполняется в контексте вызывающего репозитория, поэтому composite
      # action из factory-ci здесь недоступен, а `uses:` не принимает выражений.
      - name: Подготовка базы
        shell: bash
        run: |
          [ -f prisma/schema.prisma ] || { echo "Prisma не используется."; exit 0; }
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          export DATABASE_URL="${DATABASE_URL:-file:./dev.db}"
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - name: e2e
        shell: bash
        run: |
          if [ "${{ inputs.run-e2e }}" != "true" ]; then
            echo "e2e явно отключены защищённым caller workflow"; exit 0
          fi
          if ! ls tests/e2e/*.spec.ts >/dev/null 2>&1; then
            echo "::error::run-e2e=true, но e2e-тестов нет"; exit 1
          fi
          npx --no-install next build
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test

  # --- Проверки диффа ------------------------------------------------------
  # Код проверок живёт ЗДЕСЬ, а не в продуктовом репозитории. Reusable workflow
  # исполняется в контексте вызывающего репозитория, поэтому файлы factory-ci
  # там недоступны, а второй checkout потребовал бы токена на приватный репо —
  # ровно того секрета, которого у джоб гейтов быть не должно.
  diff-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Список изменённых файлов
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — проверки диффа пропускать нельзя, но сравнивать нечего."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" "$head" > /tmp/changed.txt
          echo "Изменено файлов: $(wc -l < /tmp/changed.txt)"
          cat /tmp/changed.txt

      - name: Безопасные имена файлов
        shell: bash
        run: |
          [ -f /tmp/changed.txt ] || { echo "::error::Нет списка изменённых файлов"; exit 1; }
          bad=0
          while IFS= read -r f; do
            if ! [[ "$f" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Недопустимое имя файла в PR"
              bad=1
            fi
          done < /tmp/changed.txt
          exit "$bad"

      - name: Тесты нельзя удалить или ослабить количеством
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Не pull_request — сравнение тестов не применяется."
            exit 0
          fi
          if git diff --name-only --diff-filter=DR "$base" "$head" -- tests/ | grep -q .; then
            echo "::error::Удаление или переименование тестового файла запрещено в обычном PR."
            exit 1
          fi
          before_tests=$({ git grep -E '\b(it|test|describe)\s*\(' "$base" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          after_tests=$({ git grep -E '\b(it|test|describe)\s*\(' "$head" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          before_asserts=$({ git grep -E '\b(expect|assert)\s*\(' "$base" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          after_asserts=$({ git grep -E '\b(expect|assert)\s*\(' "$head" -- tests/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          echo "tests: $before_tests -> $after_tests; assertions: $before_asserts -> $after_asserts"
          [ "$after_tests" -ge "$before_tests" ] || { echo "::error::Количество тестов уменьшилось"; exit 1; }
          [ "$after_asserts" -ge "$before_asserts" ] || { echo "::error::Количество assertions уменьшилось"; exit 1; }

      - name: Защищённые пути
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          [ -f /tmp/changed.txt ] || exit 0
          # .github/** решается по АВТОРУ заявки, а не по пути (D-134):
          #   приложение (pull_request.user.type != User) — .github/** запрещён
          #   целиком, без исключения для пинов: агент проверки не меняет;
          #   человек — .github/** разрешён при зелёных остальных проверках,
          #   отказа нет, есть заметность: блок «Изменение проверок».
          #   Только из своего репозитория: заявка из форка (или форк удалён,
          #   репозиторий заявки не назван) — отказ. Репозиторий публичный,
          #   посторонний тоже имеет тип User (D-135 §c).
          # Автор не назван в событии pull_request — как приложение (fail closed).
          # push в main: автора в событии нет, решение принято на заявке
          # (прямой push закрыт защитой ветки) — только блок, без отказа.
          # Урок L-011: путь «только пин» оставлял .github/* закрытым для всех,
          # включая владельца, и всё, что там менялось, входило обходом.
          case "$EVENT" in
            pull_request|pull_request_target)
              if [ "$PR_USER_TYPE" != "User" ]; then author=app
              elif [ -z "$PR_HEAD_REPO" ] || [ "$PR_HEAD_REPO" != "$REPO" ]; then author=fork
              else author=human; fi ;;
            *) author=none ;;
          esac
          echo "автор заявки: ${PR_USER_LOGIN:-не назван} (${PR_USER_TYPE:-тип не назван}, событие $EVENT, из ${PR_HEAD_REPO:-репозиторий не назван}) → $author"
          bad=0
          touched=()
          while read -r f; do
            case "$f" in
              AGENTS.md|CLAUDE.md|package.json|package-lock.json|docs/adr/*|*secret*|*.pem|.env|.env.*|eslint.config.*|tsconfig.json|vitest.config.*|playwright.config.*|security-baseline.json|lighthouse-budget.json|scripts/gates.sh|scripts/preflight.sh|scripts/apply-overlay.mjs|scripts/contract-guard.mjs)
                echo "::error file=$f::Защищённый путь. Изменение возможно только отдельным PR владельца."
                bad=1 ;;
              .github/*)
                touched+=("$f")
                if [ "$author" = app ]; then
                  echo "::error file=$f::Защищённый путь. Заявка приложения не меняет .github/** — ни код проверок, ни пин (D-134)."
                  bad=1
                elif [ "$author" = fork ]; then
                  echo "::error file=$f::Защищённый путь. .github/** меняется только заявкой из этого репозитория, не из форка (D-135 §c)."
                  bad=1
                fi ;;
            esac
          done < /tmp/changed.txt
          if [ "${#touched[@]}" -gt 0 ]; then
            {
              echo "Изменение проверок: ${#touched[@]} файл(ов) в .github/, автор ${PR_USER_LOGIN:-не назван} ($author)"
              printf '  %s\n' "${touched[@]}"
            } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
            [ "$bad" = 1 ] || echo "::warning title=Изменение проверок::Заявка меняет .github/** (${#touched[@]} файл(ов)). Отказа нет — изменение видно здесь (D-134)."
          fi
          exit "$bad"

      - name: Ослабление проверок
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          [ -f /tmp/changed.txt ] || exit 0
          node - "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.sha }}" <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const changed = fs.readFileSync("/tmp/changed.txt", "utf8")
            .split("\n").map(s => s.trim()).filter(Boolean);

          // Список check-config. Обязан пополняться при добавлении любого
          // нового инструмента проверки: инструмент, чей конфиг не в списке,
          // выведен из-под контроля.
          const CONFIG = [
            /^eslint\.config\./, /^tsconfig\.json$/, /^vitest\.config\./,
            /^playwright\.config\./, /^security-baseline\.json$/,
            /^scripts\/gates\.sh$/, /^scripts\/preflight\.sh$/,
            /^scripts\/apply-overlay\.mjs$/,
            /^scripts\/contract-guard\.mjs$/,
          ];

          const hits = changed.filter(f => CONFIG.some(re => re.test(f)));

          // Ослабление внутри кода проверок: скипы, only, подавление типов.
          const suspicious = [];
          for (const f of changed) {
            if (!/\.(ts|tsx|js|mjs)$/.test(f)) continue;
            let diff = "";
            try {
              diff = execFileSync("git", ["diff", "-U0", process.argv[2], process.argv[3], "--", f],
                                  { encoding: "utf8" });
            } catch (error) {
              console.error("Не удалось безопасно прочитать diff: " + error.message);
              process.exit(1);
            }
            const added = diff.split("\n").filter(l => l.startsWith("+") && !l.startsWith("+++"));
            for (const line of added) {
              if (/\.(skip|only)\s*\(/.test(line) ||
                  /\b(xit|xdescribe|it\.todo)\b/.test(line) ||
                  /@ts-expect-error|@ts-ignore/.test(line) ||
                  /eslint-disable/.test(line)) {
                suspicious.push(`${f}: ${line.slice(1).trim()}`);
              }
            }
          }

          if (hits.length === 0 && suspicious.length === 0) {
            console.log("Конфигурация проверок не затронута.");
            process.exit(0);
          }

          console.log("Затронуты проверки:");
          hits.forEach(h => console.log("  конфиг: " + h));
          suspicious.forEach(s => console.log("  в коде: " + s));

          // Текст пишет контролируемая сторона, поэтому он не может менять
          // красный результат механической проверки на зелёный.
          console.log("");
          console.log("::error title=Ослабление проверок::Изменение safeguards требует отдельного контролируемого owner change.");
          process.exit(1);
          NODE

      - name: Сужение контракта
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Урок L-009. Новое ОБЯЗАТЕЛЬНОЕ свойство в контракте, который уже
          # использовали чужие тесты, ломает их. typecheck это ловит, но
          # сообщением TS2769 в чужом файле — причина не названа.
          #
          # Контракт — объявление целиком, а не строка диффа (BB-48): разбор
          # идёт по тексту файла на base и на head, переносы строк роли не
          # играют. Построчный разбор принимал параметр функции, записанный
          # отдельной строкой (`array: readonly T[],`), за свойство контракта.
          #
          # Контракты: `interface X {…}`, `type X = {…}` и тип-литерал параметра
          # функции (`function V({ data }: { data: … })`). Сужение существующего
          # контракта: добавлено обязательное свойство, свойство убрано или
          # опциональное стало обязательным. Новый файл и новый контракт никого
          # не ломают. Проверка живёт здесь, а не в продуктовом репозитории.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Не pull_request — сравнивать нечего."
            exit 0
          fi
          if node - "$BASE_SHA" "$HEAD_SHA" <<'NODE'
          const { execFileSync } = require("child_process");
          const [base, head] = process.argv.slice(2);
          const git = (...args) => execFileSync("git", args, {
            encoding: "utf8", stdio: ["ignore", "pipe", "pipe"], maxBuffer: 64 << 20,
          });

          // Изменённые на обеих сторонах файлы; переименование — как удаление и
          // новый файл. Имя файла в shell не попадает: аргументы — массивом.
          let files;
          try {
            files = git("diff", "--name-only", "--no-renames", "--diff-filter=M", base, head)
              .split("\n").map((s) => s.trim())
              .filter((f) => /\.(ts|tsx)$/.test(f) && !f.startsWith("tests/"));
          } catch (e) {
            console.error("Не удалось прочитать diff: " + e.message);
            process.exit(1);
          }

          // Комментарии убираются, содержимое строк гасится: скобки внутри них
          // не сбивают глубину, а `a: b` в комментарии не становится свойством.
          function code(src) {
            let out = "";
            for (let i = 0; i < src.length; i++) {
              const c = src[i], n = src[i + 1];
              if (c === "/" && n === "/") { while (i < src.length && src[i] !== "\n") i++; out += "\n"; continue; }
              if (c === "/" && n === "*") {
                i += 2;
                while (i < src.length && !(src[i] === "*" && src[i + 1] === "/")) { if (src[i] === "\n") out += "\n"; i++; }
                i++; continue;
              }
              if (c === '"' || c === "'" || c === "`") {
                i++;
                while (i < src.length && src[i] !== c) { if (src[i] === "\\") i++; else if (src[i] === "\n") out += "\n"; i++; }
                out += c + c; continue;
              }
              out += c;
            }
            return out;
          }

          const OPEN = { "{": "}", "(": ")", "[": "]", "<": ">" };
          // Индекс закрывающей скобки для src[at]; -1, если не закрыта.
          function close(src, at) {
            const stack = [];
            for (let i = at; i < src.length; i++) {
              const c = src[i];
              if (c === ">" && src[i - 1] === "=") continue;          // стрелка =>
              if (OPEN[c] && (c !== "<" || stack.length === 0 || stack[stack.length - 1] === ">")) stack.push(OPEN[c]);
              else if (c === stack[stack.length - 1]) { stack.pop(); if (stack.length === 0) return i; }
            }
            return -1;
          }
          // Части по разделителям верхнего уровня (вне любых скобок).
          function split(body, seps) {
            const parts = [];
            let depth = 0, cur = "";
            for (let i = 0; i < body.length; i++) {
              const c = body[i];
              if (c === ">" && body[i - 1] === "=") { cur += c; continue; }
              if ("{([<".includes(c)) depth++;
              else if ("})]>".includes(c)) depth = Math.max(0, depth - 1);
              if (depth === 0 && seps.includes(c)) { parts.push(cur); cur = ""; } else cur += c;
            }
            parts.push(cur);
            return parts.map((s) => s.trim()).filter(Boolean);
          }
          // Члены тела типа: имя → опциональность. Разделитель — `;`, `,` или
          // перенос; одна строка или много — результат один и тот же.
          function members(body) {
            const props = new Map();
            for (const m of split(body, ";,\n")) {
              const p = m.match(/^(?:readonly\s+)?(?:""|'')?([A-Za-z_$][\w$]*)(\?)?\s*[:(<]/);
              if (p) props.set(p[1], Boolean(p[2]));
            }
            return props;
          }

          function contracts(src) {
            const c = code(src);
            const all = new Map();
            const decl = /\b(?:interface\s+([A-Za-z_$][\w$]*)[^{=;]*\{|type\s+([A-Za-z_$][\w$]*)\s*(?:<[^=]*>)?\s*=\s*\{)/g;
            let m;
            while ((m = decl.exec(c))) {
              const open = decl.lastIndex - 1, end = close(c, open);
              if (end !== -1) all.set("тип " + (m[1] || m[2]), members(c.slice(open + 1, end)));
            }
            const fn = /\b(?:function\s+([A-Za-z_$][\w$]*)|(?:const|let)\s+([A-Za-z_$][\w$]*)\s*(?::[^=]*)?=\s*(?:async\s+)?)\s*/g;
            while ((m = fn.exec(c))) {
              let i = fn.lastIndex;
              if (c[i] === "<") { const g = close(c, i); if (g === -1) continue; i = g + 1; while (/\s/.test(c[i])) i++; }
              if (c[i] !== "(") continue;
              const end = close(c, i);
              if (end === -1) continue;
              let k = 0;
              for (const param of split(c.slice(i + 1, end), ",")) {
                const colon = split(param, ":");
                const type = colon.length > 1 ? param.slice(param.indexOf(colon[1])).trim() : "";
                if (!type.startsWith("{")) continue;
                const te = close(type, 0);
                if (te !== -1) all.set(`сигнатура ${m[1] || m[2]} #${k++}`, members(type.slice(1, te)));
              }
            }
            return all;
          }

          const findings = [];
          for (const file of files) {
            let before, after;
            try { before = git("show", `${base}:${file}`); after = git("show", `${head}:${file}`); }
            catch (e) { console.error(`Не удалось прочитать ${file}: ${e.message}`); process.exit(1); }
            const now = contracts(after);
            for (const [name, old] of contracts(before)) {
              const cur = now.get(name);
              if (!cur) continue;                  // контракт убран или переименован — это ловит typecheck
              for (const [prop, opt] of old) {
                if (!cur.has(prop)) findings.push(`${file}: ${name} — убрано свойство ${prop}`);
                else if (opt && !cur.get(prop)) findings.push(`${file}: ${name} — свойство ${prop} стало обязательным`);
              }
              for (const [prop, opt] of cur) {
                if (!old.has(prop) && !opt) findings.push(`${file}: ${name} — добавлено ОБЯЗАТЕЛЬНОЕ свойство ${prop}`);
              }
            }
          }

          if (findings.length === 0) {
            console.log("Контракт не сужен: в существующих контрактах нет новых обязательных, убранных или ставших обязательными свойств.");
            process.exit(0);
          }
          console.log("Сужение контракта:");
          for (const f of findings) console.log("  " + f);
          console.log("Новое свойство существующего контракта — опциональное (`имя?:`); убрать свойство или сделать его обязательным — отдельное изменение контракта владельцем.");
          process.exit(1);
          NODE
          then
            exit 0
          fi
          echo "::error title=Сужение контракта::Текст PR не может переопределить красный гейт. Требуется отдельное контролируемое изменение контракта владельцем."
          exit 1

  # --- Источник заявки (D-106 §c) -----------------------------------------
  # Заявка в ветку по умолчанию из canary-base или canary/* краснеет: дефект
  # канарейки не попадает в main вторым шагом (canary → canary-base → main).
  # Ruleset на ветку-источник условия не выражает — поэтому проверка, и живёт
  # она здесь, а не в продуктовом репозитории: там её мог бы изменить агент.
  # Джоба выполняется всегда; решение — внутри шага.
  source-guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Источник заявки
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          case "$EVENT" in
            pull_request|pull_request_target) ;;
            *) echo "событие $EVENT — не заявка, источник не проверяется"; exit 0 ;;
          esac
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error title=source-guard::ветка по умолчанию неизвестна — источник заявки не проверить"
            exit 1
          fi
          case "$HEAD_REF" in
            canary-base|canary/*)
              if [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
                echo "::error title=source-guard::заявка в $BASE_REF из $HEAD_REF запрещена: канареечные ветки не вливаются в $DEFAULT_BRANCH (D-106 §c)"
                exit 1
              fi ;;
          esac
          echo "источник $HEAD_REF → $BASE_REF: допустим"

  # --- Итог гейтов (обязательная проверка) ---------------------------------
  verdict:
    needs: [preflight, deps-guard, checks, e2e, diff-guards, source-guard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Разбор результатов
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          PREFLIGHT_STATUS: ${{ needs.preflight.outputs.status }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
          GUARDS: ${{ needs.diff-guards.result }}
          DEPS: ${{ needs.deps-guard.result }}
          SOURCE: ${{ needs.source-guard.result }}
        run: |
          echo "предполёт: $PREFLIGHT ($PREFLIGHT_STATUS)"
          echo "гейты:     $CHECKS"
          echo "e2e:       $E2E"
          echo "дифф:      $GUARDS"
          echo "зависимости: $DEPS"
          echo "источник:  $SOURCE"
          {
            echo "## Factory CI verdict"
            echo
            echo "| Проверка | Результат |"
            echo "|---|---|"
            echo "| preflight | $PREFLIGHT |"
            echo "| dependencies | $DEPS |"
            echo "| checks | $CHECKS |"
            echo "| e2e | $E2E |"
            echo "| diff guards | $GUARDS |"
            echo "| source guard | $SOURCE |"
            echo
            echo "Exact commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PREFLIGHT_STATUS" = "env_fail" ]; then
            echo "::error title=env_fail::Отказ окружения. Попытка задачи НЕ засчитывается, ретрай не запускать."
            echo "ENVFAIL=1" >> "$GITHUB_ENV"
            exit 1
          fi

          bad=0
          for r in "$PREFLIGHT" "$DEPS" "$CHECKS" "$E2E" "$GUARDS" "$SOURCE"; do
            # skipped засчитывается как провал: пропущенная проверка ничего не проверила
            [ "$r" = "success" ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::Есть непройденные проверки."; exit 1; }
          echo "Все проверки пройдены."
